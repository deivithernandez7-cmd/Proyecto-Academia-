<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Eliminar Curso</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card border-danger shadow-sm">
                <div class="card-header bg-danger text-white">
                    <h4 class="mb-0">¿Confirmar eliminación?</h4>
                </div>
                <div class="card-body">
                    <p class="fs-5">¿Estás seguro de que deseas eliminar permanentemente el curso <strong>{{ curso.nombre }}</strong> (Código: {{ curso.codigo }})?</p>
                    <p class="text-muted small">Esta acción no se puede deshacer y desvinculará a los alumnos inscritos.</p>
                    
                    <form method="post">
                        {% csrf_token %}
                        <div class="d-flex justify-content-between mt-4">
                            <a href="{% url 'web_lista_cursos' %}" class="btn btn-secondary">Cancelar</a>
                            <button type="submit" class="btn btn-danger">Sí, Eliminar Registro</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
